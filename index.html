<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e13;
    --surface:#12161d;
    --surface-2:#171d26;
    --line: rgba(234,240,246,0.10);
    --line-strong: rgba(234,240,246,0.18);
    --text:#eaf0f6;
    --muted:#8291a3;
    --ice:#a9d3f2;
    --ice-dim: rgba(169,211,242,0.14);
    --amber:#e2a64d;
    --amber-dim: rgba(226,166,77,0.14);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
  }
  ::selection{ background:var(--ice-dim); color:var(--ice); }

  h1,h2,h3, .display{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    letter-spacing:0.01em;
    margin:0;
  }

  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }

  :focus-visible{
    outline: 2px solid var(--ice);
    outline-offset: 3px;
  }


  .shell{
    position:relative;
    min-height:100vh;
  }


  .topnav{
    position:fixed;
    top:0; right:0; left:0;
    z-index:100;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 22px clamp(20px, 5vw, 56px);
    pointer-events:none;
  }
  .brandmark{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.02em;
    color:var(--text);
    pointer-events:auto;
    opacity:0.9;
  }
  .brandmark span{ color:var(--muted); }

  .menu{
    display:flex;
    gap:4px;
    background: rgba(11,14,19,0.55);
    backdrop-filter: blur(10px);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px;
    pointer-events:auto;
  }
  .menu button{
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:14px;
    font-weight:500;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    transition: color .2s ease, background .2s ease;
    white-space:nowrap;
  }
  .menu button:hover{ color:var(--text); }
  .menu button.active{
    background: rgba(234,240,246,0.12);
    color:var(--text);
  }

  @media (max-width:560px){
    .brandmark{ display:none; }
    .topnav{ justify-content:flex-end; padding:16px; }
    .menu button{ padding:7px 11px; font-size:12.5px; }
  }


  .page{
    display:none;
    min-height:100vh;
  }
  .page.active{ display:block; }


  #page-home{
    position:relative;
    height:100vh;
    display:flex;
    align-items:flex-end;
    overflow:hidden;
    background: linear-gradient(180deg, #0b0e13 0%, #0d1118 55%, #0a0c11 100%);
  }
  .bg-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    z-index:0;
  }
  .video-overlay{
    position:absolute;
    inset:0;
    z-index:1;
    background:
      linear-gradient(180deg, rgba(8,10,14,0.55) 0%, rgba(8,10,14,0.25) 35%, rgba(8,10,14,0.55) 70%, rgba(6,8,11,0.92) 100%),
      radial-gradient(ellipse 900px 500px at 78% 8%, rgba(226,166,77,0.12), transparent 60%);
  }
  #snowfall{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
    z-index:2;
  }
  .hero-inner{
    position:relative;
    z-index:5;
    width:100%;
    padding: 0 clamp(20px,6vw,64px) clamp(56px, 9vw, 100px);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:32px;
    flex-wrap:wrap;
  }
  .hero-title{
    font-size: clamp(52px, 11vw, 148px);
    line-height:0.88;
    color:var(--text);
  }
  .hero-title .line2{ color:var(--muted); }
  .hero-sub{
    max-width:360px;
    color:var(--muted);
    font-size:15px;
    line-height:1.6;
    padding-bottom:10px;
  }
  .hero-sub .role{
    display:block;
    color:var(--ice);
    font-size:13px;
    letter-spacing:0.04em;
    margin-bottom:10px;
  }
  .hero-cta{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-top:18px;
    padding:11px 20px;
    border-radius:999px;
    border:1px solid var(--line-strong);
    color:var(--text);
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    background:transparent;
    transition: border-color .2s ease, background .2s ease;
  }
  .hero-cta:hover{ border-color:var(--ice); background:var(--ice-dim); }
  .hero-cta .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 10px var(--amber);
  }


  .page-head{
    padding: 130px clamp(20px,6vw,64px) 30px;
    border-bottom:1px solid var(--line);
  }
  .page-head h2{
    font-size:clamp(38px,6vw,64px);
    line-height:0.95;
  }
  .page-head p{
    color:var(--muted);
    max-width:460px;
    margin-top:14px;
    font-size:14.5px;
    line-height:1.6;
  }
  .page-head .hero-cta{
    margin-top:22px;
  }


  #page-works .grid{
    padding: 10px clamp(20px,6vw,64px) 60px;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:1px;
    background:var(--line);
  }
  @media (max-width:1100px){ #page-works .grid{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:760px){ #page-works .grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:460px){ #page-works .grid{ grid-template-columns:1fr; } }

  .work-card{
    background:var(--bg);
    padding:16px 16px 14px;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    aspect-ratio: 1 / 1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:14px;
  }
  .work-cover{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }
  .work-shade{
    position:absolute;
    inset:0;
    z-index:1;
    background: linear-gradient(180deg, rgba(6,8,11,0.15) 0%, rgba(6,8,11,0.35) 55%, rgba(6,8,11,0.85) 100%);
    opacity:0;
    transition:opacity .3s ease;
  }
  .work-card.has-cover .work-shade{ opacity:1; }
  .work-card::before{
    content:"";
    position:absolute; inset:0;
    opacity:0;
    transition:opacity .35s ease;
    background: var(--grad);
    z-index:0;
  }
  .work-card:not(.has-cover):hover::before{ opacity:0.18; }
  .work-card.has-cover:hover .work-cover{ transform:scale(1.04); }
  .work-cover{ transition: transform .4s ease; }
  .work-index{
    font-family:'Big Shoulders Display', sans-serif;
    font-size:12px;
    color:var(--muted);
    position:relative; z-index:2;
  }
  .work-title{
    font-family:'Big Shoulders Display', sans-serif;
    font-size:19px;
    font-weight:600;
    line-height:1.05;
    margin-top:14px;
    position:relative; z-index:2;
  }
  .work-tag{
    color:var(--muted);
    font-size:11.5px;
    margin-top:4px;
    position:relative; z-index:2;
  }
  .work-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative; z-index:2;
  }
  .work-play{
    width:28px;height:28px;
    border-radius:50%;
    border:1px solid var(--line-strong);
    display:flex;align-items:center;justify-content:center;
    transition: border-color .2s ease, background .2s ease, transform .2s ease;
  }
  .work-card:hover .work-play{
    border-color:var(--ice);
    background:var(--ice-dim);
    transform:scale(1.06);
  }
  .work-play svg{ width:10px; height:10px; fill:var(--text); margin-left:1px; }
  .work-card.playing::before{ opacity:0.24; }
  .work-card.playing .work-play{
    border-color:var(--ice);
    background:var(--ice-dim);
  }
  .work-card.playing .work-index{ color:var(--ice); }


  #page-social .list{
    padding: 10px clamp(20px,6vw,64px) 90px;
  }
  .social-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 26px 4px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition: padding-left .25s ease;
  }
  .social-row:hover{ padding-left:14px; }
  .social-left{
    display:flex;
    align-items:center;
    gap:20px;
  }
  .social-avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    flex-shrink:0;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg, var(--ice), var(--amber));
    color:var(--bg);
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    font-size:18px;
  }
  .social-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .social-num{
    color:var(--muted);
    font-size:13px;
    font-family:'Big Shoulders Display', sans-serif;
    width:20px;
    flex-shrink:0;
  }
  .social-name{
    font-family:'Big Shoulders Display', sans-serif;
    font-size:clamp(24px,4vw,36px);
    font-weight:600;
    transition:color .2s ease;
  }
  .social-row:hover .social-name{ color:var(--ice); }
  .social-handle{
    color:var(--muted);
    font-size:13px;
    margin-top:2px;
  }
  .social-arrow{
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid var(--line-strong);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transition: transform .25s ease, border-color .2s ease, background .2s ease;
  }
  .social-row:hover .social-arrow{
    transform:rotate(45deg);
    border-color:var(--amber);
    background:var(--amber-dim);
  }
  .social-arrow svg{ width:12px;height:12px; fill:var(--text); }


  .foot{
    padding: 30px clamp(20px,6vw,64px) 40px;
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:12.5px;
    border-top:1px solid var(--line);
  }


  .modal-overlay{
    position:fixed;
    inset:0;
    z-index:300;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background: rgba(6,8,11,0.72);
    backdrop-filter: blur(8px);
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease;
  }
  .modal-overlay.open{
    opacity:1;
    pointer-events:auto;
  }
  .modal-card{
    position:relative;
    width:min(360px, 100%);
    background:var(--surface);
    border:1px solid var(--line-strong);
    border-radius:22px;
    padding:40px 28px 28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    transform: translateY(16px) scale(0.97);
    transition: transform .28s ease;
  }
  .modal-overlay.open .modal-card{
    transform: translateY(0) scale(1);
  }
  .modal-close{
    position:absolute;
    top:14px; right:14px;
    width:30px;height:30px;
    border-radius:50%;
    border:1px solid var(--line-strong);
    background:transparent;
    color:var(--muted);
    font-size:13px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition: border-color .2s ease, color .2s ease;
  }
  .modal-close:hover{ border-color:var(--ice); color:var(--text); }
  .modal-avatar{
    width:88px;height:88px;
    border-radius:50%;
    overflow:hidden;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background: linear-gradient(135deg, var(--ice), var(--amber));
    color:var(--bg);
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    font-size:32px;
    margin-bottom:18px;
  }
  .modal-avatar img{
    width:100%;height:100%;
    object-fit:cover;
  }
  .modal-name{
    font-family:'Big Shoulders Display', sans-serif;
    font-size:30px;
    font-weight:600;
  }
  .modal-handle{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
  }
  .modal-desc{
    color:var(--muted);
    font-size:13.5px;
    line-height:1.6;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition: max-height .3s ease, opacity .25s ease, margin-top .3s ease;
  }
  .modal-desc.open{
    max-height:220px;
    opacity:1;
    margin-top:16px;
  }
  .modal-actions{
    display:flex;
    gap:10px;
    width:100%;
    margin-top:24px;
  }
  .modal-btn{
    flex:1;
    padding:12px 0;
    border-radius:999px;
    border:1px solid var(--line-strong);
    background:transparent;
    color:var(--text);
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    text-align:center;
    transition: border-color .2s ease, background .2s ease;
  }
  .modal-btn:hover{ border-color:var(--ice); background:var(--ice-dim); }
  .modal-btn-primary{
    border-color: var(--amber);
    color:var(--amber);
  }
  .modal-btn-primary:hover{ background:var(--amber-dim); }
</style>
</head>
<body>

<div class="shell">

  <nav class="topnav">
    <div class="brandmark">PONY <span>· im</span></div>
    <div class="menu" role="tablist" aria-label="Навигация">
      <button class="active" data-page="home" role="tab" aria-selected="true">Главная</button>
      <button data-page="works" role="tab" aria-selected="false">Песни</button>
      <button data-page="social" role="tab" aria-selected="false">Соц сети</button>
    </div>
  </nav>

  
  <section id="page-home" class="page active">
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="video.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
    <canvas id="snowfall"></canvas>

    <div class="hero-inner">
      <h1 class="hero-title">УМЕР<br><span class="line2">НОЧЬЮ</span></h1>
      <div class="hero-sub">
        Начинаю работать лишь в моменты, когда дневной свет рассеивается.
        <button class="hero-cta nav-cta" data-target="works" onclick="goTo('works')">
          <span class="dot"></span> Слушать песни
        </button>
      </div>
    </div>
  </section>

  
  <section id="page-works" class="page">
    <div class="page-head">
      <h2>Песни</h2>
      <p>Любимые песни</p>
      <button class="hero-cta nav-cta" data-target="social" onclick="goTo('social')">
        <span class="dot"></span> Перейти к соц сетям
      </button>
    </div>
    <div class="grid" id="works-grid"></div>
  </section>

  
  <section id="page-social" class="page">
    <div class="page-head">
      <h2>Соц сети</h2>
    </div>
    <div class="list" id="social-list"></div>
  </section>

  <div class="foot">
    <span>© Bruuh</span>
    <span>Pony </span>
  </div>

</div>

<div class="modal-overlay" id="social-modal" aria-hidden="true">
  <div class="modal-card">
    <button class="modal-close" id="modal-close" aria-label="Закрыть">✕</button>
    <div class="modal-avatar" id="modal-avatar"></div>
    <div class="modal-name" id="modal-name"></div>
    <div class="modal-handle" id="modal-handle"></div>
    <div class="modal-desc" id="modal-desc"></div>
    <div class="modal-actions">
      <button class="modal-btn" id="modal-desc-toggle">Описание</button>
      <a class="modal-btn modal-btn-primary" id="modal-goto" href="#" target="_blank" rel="noopener">Перейти</a>
    </div>
  </div>
</div>

<script>

  function goTo(name){
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.querySelectorAll('.menu button').forEach(b => {
      const isActive = b.dataset.page === name;
      b.classList.toggle('active', isActive);
      b.setAttribute('aria-selected', isActive);
    });
    window.scrollTo({top:0, behavior:'instant'});
  }
  document.querySelectorAll('.menu button').forEach(b=>{
    b.addEventListener('click', ()=> goTo(b.dataset.page));
  });

  
  const tracks = [
    {title:"В этот раз", tag:"Полухтенко", src:"В этот раз.mp3", cover:"вэтотраз.jpg", grad:"linear-gradient(135deg,#a9d3f2,#0b0e13)"},
    {title:"Динозаврики", tag:"Папин Олимпос", src:"динозаврики .mp3", cover:"динозаврики.jpg", grad:"linear-gradient(135deg,#e2a64d,#0b0e13)"},
    {title:"Мантра", tag:"Фриман", src:"мантра.mp3", cover:"мантра.jpg", grad:"linear-gradient(135deg,#7ea8c4,#0b0e13)"},
    {title:"Шли два бога", tag:"Чебыкин", src:"боги.mp3", cover:"боги.jpg", grad:"linear-gradient(135deg,#c48a4d,#0b0e13)"},
    {title:"Хорошо", tag:"Я Софа", src:"хорошо.mp3", cover:"хорошо.jpg", grad:"linear-gradient(135deg,#89b3d1,#0b0e13)"},
    {title:"Восемь", tag:"Спать на потолке", src:"восемь.mp3", cover:"восемь.jpg", grad:"linear-gradient(135deg,#d9b06a,#0b0e13)"},
  ];
  const grid = document.getElementById('works-grid');
  const playerAudio = new Audio();
  const trackCards = [];
  let playingIndex = null;

  const PLAY_ICON = '<path d="M8 5v14l11-7z"/>';
  const PAUSE_ICON = '<path d="M6 5h4.5v14H6zM13.5 5H18v14h-4.5z"/>';

  function setCardPlaying(el, playing){
    el.classList.toggle('playing', playing);
    el.querySelector('.work-play svg').innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
  }

  function toggleTrack(i, el){
    if(playingIndex === i && !playerAudio.paused){
      playerAudio.pause();
      setCardPlaying(el, false);
      playingIndex = null;
      return;
    }
    if(playingIndex !== null && trackCards[playingIndex]){
      setCardPlaying(trackCards[playingIndex], false);
    }
    playerAudio.src = tracks[i].src;
    playerAudio.play().catch(()=>{ /* трек ещё не добавлен в папку сайта */ });
    playingIndex = i;
    setCardPlaying(el, true);
  }
  playerAudio.addEventListener('ended', ()=>{
    if(playingIndex !== null && trackCards[playingIndex]) setCardPlaying(trackCards[playingIndex], false);
    playingIndex = null;
  });

  tracks.forEach((w,i)=>{
    const el = document.createElement('div');
    el.className = 'work-card' + (w.cover ? ' has-cover' : '');
    el.style.setProperty('--grad', w.grad);
    const coverImg = w.cover ? `<img class="work-cover" src="${w.cover}" alt="" onerror="this.closest('.work-card').classList.remove('has-cover'); this.remove();">` : '';
    const shade = w.cover ? `<div class="work-shade"></div>` : '';
    el.innerHTML = `
      ${coverImg}
      ${shade}
      <div class="work-index">${String(i+1).padStart(2,'0')}</div>
      <div>
        <div class="work-title">${w.title}</div>
        <div class="work-tag">${w.tag}</div>
      </div>
      <div class="work-bottom">
        <span class="work-tag" style="margin-top:0">Трек</span>
        <div class="work-play">
          <svg viewBox="0 0 24 24">${PLAY_ICON}</svg>
        </div>
      </div>`;
    el.addEventListener('click', (e)=>{ e.preventDefault(); toggleTrack(i, el); });
    trackCards.push(el);
    grid.appendChild(el);
  });

  /* ---------- social data (placeholders) ---------- */
  /* чтобы добавить фото канала — впиши ссылку на картинку в поле img, например img:"avatar1.jpg" */
  const socials = [
    {name:"PDP", handle:"@PDPTHISYOU", img:"ava.jpg", desc:"PDP — PDP Ты и есть PDP", url:"https://t.me/PDPTHISYOU"},
    {name:"Заглушка", handle:"@channel_two", img:"ava1.jpg", desc:"Здесь будет описание канала: о чём он и что внутри.", url:"#"},
    {name:"Заглушка", handle:"@channel_backstage", img:"ava2.jpg", desc:"Здесь будет описание канала: о чём он и что внутри.", url:"#"},
  ];
  const list = document.getElementById('social-list');
  socials.forEach((s,i)=>{
    const el = document.createElement('a');
    el.className = 'social-row';
    el.href = '#';
    const avatar = s.img
      ? `<img src="${s.img}" alt="${s.name}">`
      : s.name.charAt(0).toUpperCase();
    el.innerHTML = `
      <div class="social-left">
        <div class="social-avatar">${avatar}</div>
        <span class="social-num">${String(i+1).padStart(2,'0')}</span>
        <div>
          <div class="social-name">${s.name}</div>
          <div class="social-handle">${s.handle}</div>
        </div>
      </div>
      <div class="social-arrow">
        <svg viewBox="0 0 24 24"><path d="M6 18L18 6M18 6H8M18 6v10"/></svg>
      </div>`;
    el.addEventListener('click', (e)=>{ e.preventDefault(); openSocialModal(s); });
    list.appendChild(el);
  });


  const socialModal = document.getElementById('social-modal');
  const modalAvatar = document.getElementById('modal-avatar');
  const modalName = document.getElementById('modal-name');
  const modalHandle = document.getElementById('modal-handle');
  const modalDesc = document.getElementById('modal-desc');
  const modalGoto = document.getElementById('modal-goto');
  const modalDescToggle = document.getElementById('modal-desc-toggle');
  const modalClose = document.getElementById('modal-close');

  function openSocialModal(s){
    modalAvatar.innerHTML = s.img
      ? `<img src="${s.img}" alt="${s.name}">`
      : s.name.charAt(0).toUpperCase();
    modalName.textContent = s.name;
    modalHandle.textContent = s.handle;
    modalDesc.textContent = s.desc || '';
    modalDesc.classList.remove('open');
    modalDescToggle.textContent = 'Описание';
    modalGoto.href = s.url || '#';
    socialModal.classList.add('open');
    socialModal.setAttribute('aria-hidden', 'false');
  }
  function closeSocialModal(){
    socialModal.classList.remove('open');
    socialModal.setAttribute('aria-hidden', 'true');
  }
  modalClose.addEventListener('click', closeSocialModal);
  socialModal.addEventListener('click', (e)=>{ if(e.target === socialModal) closeSocialModal(); });
  document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeSocialModal(); });
  modalDescToggle.addEventListener('click', ()=>{
    const isOpen = modalDesc.classList.toggle('open');
    modalDescToggle.textContent = isOpen ? 'Скрыть' : 'Описание';
  });

  
  const canvas = document.getElementById('snowfall');
  const ctx = canvas.getContext('2d');
  let flakes = [];
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    canvas.width = canvas.offsetWidth * devicePixelRatio;
    canvas.height = canvas.offsetHeight * devicePixelRatio;
  }
  function initFlakes(){
    const count = Math.min(90, Math.floor(canvas.offsetWidth / 12));
    flakes = Array.from({length: count}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: (Math.random() * 1.6 + 0.6) * devicePixelRatio,
      speed: (Math.random() * 0.6 + 0.25) * devicePixelRatio,
      drift: (Math.random() - 0.5) * 0.4 * devicePixelRatio,
      alpha: Math.random() * 0.5 + 0.25
    }));
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width, canvas.height);
    ctx.fillStyle = '#eaf0f6';
    flakes.forEach(f=>{
      ctx.globalAlpha = f.alpha;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
      ctx.fill();
      f.y += f.speed;
      f.x += f.drift;
      if(f.y > canvas.height){ f.y = -5; f.x = Math.random()*canvas.width; }
    });
    ctx.globalAlpha = 1;
    if(!prefersReduced) requestAnimationFrame(draw);
  }
  window.addEventListener('resize', ()=>{ resize(); initFlakes(); });
  resize(); initFlakes();
  if(!prefersReduced){ requestAnimationFrame(draw); } else { draw(); }
</script>

</body>
</html>
